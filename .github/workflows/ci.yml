name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_UI: stream
  # Placeholders so `next build` passes in CI (real values live in Vercel).
  # pk_test_Y2xlcmsuZXhhbXBsZS5jb20k = base64("clerk.example.com$") — Clerk validates key format.
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
  CLERK_SECRET_KEY: sk_test_placeholder
  CLERK_WEBHOOK_SECRET: whsec_placeholder
  NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
  NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
  DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
  EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
  EXPO_PUBLIC_API_URL: http://localhost:3000

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # No version input — reads "packageManager" from root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, type-check, test, build
        run: pnpm turbo run lint check-types test build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Requires real dev-instance secrets (see apps/web/.env.local.example) — this job fails
    # until E2E_CLERK_PUBLISHABLE_KEY, E2E_CLERK_SECRET_KEY, E2E_DATABASE_URL,
    # E2E_CLERK_TEST_EMAIL, and E2E_CLERK_TEST_PASSWORD are added as repo secrets.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_CLERK_TEST_EMAIL: ${{ secrets.E2E_CLERK_TEST_EMAIL }}
      E2E_CLERK_TEST_PASSWORD: ${{ secrets.E2E_CLERK_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter passe-web exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm --filter passe-web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
