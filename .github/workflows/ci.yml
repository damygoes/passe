name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_UI: stream

jobs:
  quality:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Placeholders so `next build` passes in this job (real values live in Vercel).
    # Scoped to this job only — the `deploy` job must NOT see these, since GitHub Actions
    # env vars take precedence over the real values `vercel pull` fetches into
    # .env.production.local, which would bake the placeholder Clerk key into prod.
    # pk_test_Y2xlcmsuZXhhbXBsZS5jb20k = base64("clerk.example.com$") — Clerk validates key format.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      CLERK_SECRET_KEY: sk_test_placeholder
      CLERK_WEBHOOK_SECRET: whsec_placeholder
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsuZXhhbXBsZS5jb20k
      EXPO_PUBLIC_API_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5

      # No version input — reads "packageManager" from root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Sequential (not one combined `turbo run lint check-types test build`) so a
      # broken lint fails fast without also burning time on type-check/test/build.
      - name: Lint
        run: pnpm turbo run lint

      - name: Type-check
        run: pnpm turbo run check-types

      - name: Unit tests
        run: pnpm turbo run test

      - name: Build
        run: pnpm turbo run build

  e2e:
    name: Playwright e2e
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Uses real dev-instance secrets (see apps/web/.env.local.example): E2E_CLERK_PUBLISHABLE_KEY,
    # E2E_CLERK_SECRET_KEY, E2E_DATABASE_URL, E2E_CLERK_TEST_EMAIL, E2E_CLERK_TEST_PASSWORD.
    env:
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.E2E_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.E2E_CLERK_SECRET_KEY }}
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      E2E_CLERK_TEST_EMAIL: ${{ secrets.E2E_CLERK_TEST_EMAIL }}
      E2E_CLERK_TEST_PASSWORD: ${{ secrets.E2E_CLERK_TEST_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm --filter passe-web exec playwright install --with-deps chromium

      # e2e runs against `next start` in CI (see playwright.config.ts webServer) — the dev
      # server's on-demand route compilation is too slow on CI runners and flakes the suite.
      # Plain `next build` (not turbo) so the remote cache never serves a build with the
      # quality job's placeholder NEXT_PUBLIC_* values baked in.
      - name: Build web app
        run: pnpm --filter passe-web build

      - name: Run e2e tests
        run: pnpm --filter passe-web test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  deploy:
    name: Deploy (Vercel)
    needs: e2e
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # Vercel's Git integration auto-deploy is disabled for the `main` branch
      # (see the project's Ignored Build Step) so this job is the sole path to
      # production, gated on e2e passing. PR preview deploys still go through
      # Vercel's Git integration untouched.
      - name: Pull Vercel environment
        run: pnpm dlx vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      - name: Build for Vercel
        run: pnpm dlx vercel build --prod --token=$VERCEL_TOKEN

      - name: Deploy to Vercel
        run: pnpm dlx vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

  eas-ota:
    name: EAS Update (OTA)
    needs: e2e
    if: vars.EAS_READY == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: eas-update
      cancel-in-progress: false # serialize so quick merges can't publish out of order
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # paths-filter needs history to diff against github.event.before

      # Replaces eas-update.yml's `on.push.paths` filter — that workflow no longer
      # triggers on push, since this job now lives in the same pipeline as e2e/deploy.
      - name: Check for mobile-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mobile:
              - 'apps/mobile/**'
              - 'packages/auth/**'
              - 'packages/hooks/**'
              - 'packages/i18n/**'
              - 'packages/logger/**'
              - 'packages/theme/**'
              - 'packages/types/**'
              - 'packages/utils/**'
              - 'packages/ui/src/icon/**'

      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.mobile == 'true'

      - uses: actions/setup-node@v5
        if: steps.filter.outputs.mobile == 'true'
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        if: steps.filter.outputs.mobile == 'true'
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        if: steps.filter.outputs.mobile == 'true'
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        if: steps.filter.outputs.mobile == 'true'
        working-directory: apps/mobile
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual OTA update' }}
        # eas update bundles locally, so every EXPO_PUBLIC_* the app reads must be set at
        # bundle time. `--environment production` resolves them from the EAS production
        # environment (`eas env:list production`) instead of restating them here. They
        # used to be hardcoded, and that copy had drifted: it pointed at the apex host
        # (which 307s to www for /api/* — the Authorization header is dropped across a
        # host change, so authed requests 401) and omitted the RevenueCat keys entirely,
        # which would have inlined `undefined` and silently disabled purchases.
        run: |
          eas update --channel production --environment production \
            --message "$COMMIT_MESSAGE" --non-interactive
