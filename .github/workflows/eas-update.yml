name: EAS Update (OTA)

# Manual escape hatch to (re-)publish an over-the-air JS update to the production
# channel. The automatic publish-on-push-to-main flow lives in ci.yml's `eas-ota`
# job (gated on e2e passing), not here. Gated on the EAS_READY repo variable —
# jobs are skipped (not failed) until the EAS project exists.

on:
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: false # serialize so quick merges can't publish out of order

jobs:
  update:
    if: vars.EAS_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: apps/mobile
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual OTA update' }}
        # eas update bundles locally, so every EXPO_PUBLIC_* the app reads must be set at
        # bundle time. `--environment production` resolves them from the EAS production
        # environment (`eas env:list production`) instead of restating them here. They
        # used to be hardcoded, and that copy had drifted: it pointed at the apex host
        # (which 307s to www for /api/* — the Authorization header is dropped across a
        # host change, so authed requests 401) and omitted the RevenueCat keys entirely,
        # which would have inlined `undefined` and silently disabled purchases.
        run: |
          eas update --channel production --environment production \
            --message "$COMMIT_MESSAGE" --non-interactive
