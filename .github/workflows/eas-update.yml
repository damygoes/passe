name: EAS Update (OTA)

# Manual escape hatch to (re-)publish an over-the-air JS update to the production
# channel. The automatic publish-on-push-to-main flow lives in ci.yml's `eas-ota`
# job (gated on e2e passing), not here. Gated on the EAS_READY repo variable —
# jobs are skipped (not failed) until the EAS project exists.

on:
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: false # serialize so quick merges can't publish out of order

jobs:
  update:
    if: vars.EAS_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: apps/mobile
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual OTA update' }}
          # eas update bundles locally, so EXPO_PUBLIC_* must be in the process env.
          # Production Clerk key — must stay in sync with eas.json build profiles.
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsucGFzc2UuY2Mk
          EXPO_PUBLIC_API_URL: https://passe.cc
        run: eas update --channel production --message "$COMMIT_MESSAGE" --non-interactive
