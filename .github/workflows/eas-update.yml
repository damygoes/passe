name: EAS Update (OTA)

# Publishes an over-the-air JS update to the production channel whenever
# mobile-relevant code lands on main. Gated on the EAS_READY repo variable —
# jobs are skipped (not failed) until the EAS project exists.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/auth/**'
      - 'packages/hooks/**'
      - 'packages/i18n/**'
      - 'packages/logger/**'
      - 'packages/theme/**'
      - 'packages/types/**'
      - 'packages/utils/**'
      # Mobile only consumes the icon map from @passe/ui — the rest is DOM-based
      - 'packages/ui/src/icon/**'
  workflow_dispatch:

concurrency:
  group: eas-update
  cancel-in-progress: false # serialize so quick merges can't publish out of order

jobs:
  update:
    if: vars.EAS_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish OTA update
        working-directory: apps/mobile
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message || 'Manual OTA update' }}
          # eas update bundles locally, so EXPO_PUBLIC_* must be in the process env.
          # TODO(clerk-prod): still the dev pk_test key — swap to pk_live before launch (must match eas.json).
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ZXhwZXJ0LWJhcm5hY2xlLTkzLmNsZXJrLmFjY291bnRzLmRldiQ
          EXPO_PUBLIC_API_URL: https://passe.cc
        run: eas update --channel production --message "$COMMIT_MESSAGE" --non-interactive
