name: EAS Build

# Queues native builds on EAS servers (--no-wait keeps the runner cheap).
# Triggered by mobile-v* tags (always auto-submits: iOS → TestFlight,
# Android → Play internal track) or manually via workflow_dispatch.
# Gated on the EAS_READY repo variable until the EAS project exists.

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        options: [all, ios, android]
        default: all
      profile:
        description: Build profile
        type: choice
        options: [production, preview]
        default: production
      auto_submit:
        description: Submit to stores after build
        type: boolean
        default: true

jobs:
  build:
    if: vars.EAS_READY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      # eas needs node_modules to evaluate app.json config plugins
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build (and submit)
        working-directory: apps/mobile
        run: >
          eas build
          --platform ${{ inputs.platform || 'all' }}
          --profile ${{ inputs.profile || 'production' }}
          --non-interactive
          --no-wait
          ${{ (github.event_name == 'push' || inputs.auto_submit) && '--auto-submit' || '' }}
