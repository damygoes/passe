name: DB Migrate (production)

on:
  push:
    branches: [main]
    paths:
      - 'packages/db/migrations/**'
  workflow_dispatch:

# Never run two migration jobs at once; queue instead of cancelling
concurrency:
  group: db-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # No version input — reads "packageManager" from root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fail loudly with a clear message if the secret is missing or malformed —
      # drizzle-kit swallows connection errors and exits 1 without printing them
      - name: Validate database URL
        env:
          DATABASE_URL_PROD: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          node -e "
            const raw = process.env.DATABASE_URL_PROD ?? ''
            const url = raw.trim().replace(/^['\"]|['\"]\$/g, '')
            if (!url) throw new Error('PROD_DATABASE_URL secret is empty')
            const u = new URL(url)
            console.log('URL ok — protocol:', u.protocol, 'length:', url.length)
          "

      - name: Run migrations against production
        env:
          DATABASE_URL_PROD: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm --filter @passe/db db:migrate:prod
