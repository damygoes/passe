name: DB Migrate (production)

on:
  push:
    branches: [main]
    paths:
      - 'packages/db/migrations/**'
  workflow_dispatch:

# Never run two migration jobs at once; queue instead of cancelling
concurrency:
  group: db-migrate-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # No version input — reads "packageManager" from root package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations against production
        env:
          DATABASE_URL_PROD: ${{ secrets.PROD_DATABASE_URL }}
        run: pnpm --filter @passe/db db:migrate:prod
